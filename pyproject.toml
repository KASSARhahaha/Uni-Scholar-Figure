[project]
name = "dakecli"
version = "1.2.0"
description = "Clean-room Python CLI reproduction of DakeSCI 1.2 PPT plugin behaviors"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0.2",
    "Pillow>=10.0.0",
    "typer>=0.12.0",
]

[project.scripts]
dake = "dakecli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dakecli"]
