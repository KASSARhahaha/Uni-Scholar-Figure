[project]
name = "unisfigure"
version = "1.3.0"
description = "Clean-room Python CLI reproduction of UniScholarFigure 1.2 PPT plugin behaviors"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0.2",
    "Pillow>=10.0.0",
    "typer>=0.12.0",
]

[project.scripts]
unisfig = "unisfigure.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unisfigure"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long (we trust our own wrapping judgment)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow pytest.raises in tests
"src/unisfigure/cli.py" = ["B008"]  # typer.Option/Argument in defaults is idiomatic

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/unisfigure"]
