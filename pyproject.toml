[project]
name = "unisfigure"
version = "1.2.2"
description = "Clean-room Python CLI reproduction of UniScholarFigure 1.2 PPT plugin behaviors"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0.2",
    "Pillow>=10.0.0",
    "typer>=0.12.0",
]

[project.scripts]
unisfig = "unisfigure.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unisfigure"]
